<!DOCTYPE html>
<html lang="{{HTML_LANG}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <link rel="icon" type="image/png" href="codewiki-icon.png">
    <script>
        // Apply persisted theme before first paint to avoid a flash of the wrong theme
        (function() {
            try {
                var theme = localStorage.getItem('codewiki-theme');
                if (!theme) {
                    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" id="hljs-theme-light">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" id="hljs-theme-dark" disabled>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.9.0/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-gfm-heading-id@3.1.3/lib/index.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <style>
        :root {
            --primary-color: #d95f00;
            --active-nav-bg: #0d2b50;
            --active-nav-text: #ffffff;
            --secondary-color: #f1f5f9;
            --text-color: #334155;
            --border-color: #e2e8f0;
            --hover-color: #f8fafc;
            --code-bg: #f8fafc;
            --page-bg: #ffffff;
            --panel-bg: #ffffff;
            --heading-color: #1e293b;
            --subheading-color: #475569;
            --body-color: #475569;
            --muted-color: #64748b;
            --inline-code-color: #e11d48;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-color: #991b1b;
            --backdrop-color: rgba(15, 23, 42, 0.5);
            --lightbox-bg: rgba(255, 255, 255, 0.97);
            --search-flash-bg: rgba(217, 95, 0, 0.12);
        }

        html[data-theme="dark"] {
            color-scheme: dark;
            --primary-color: #ff9a2e;
            --active-nav-bg: #c45100;
            --active-nav-text: #ffffff;
            --secondary-color: #111827;
            --text-color: #cbd5e1;
            --border-color: #334155;
            --hover-color: #1e293b;
            --code-bg: #0d1117;
            --page-bg: #0f172a;
            --panel-bg: #1e293b;
            --heading-color: #f1f5f9;
            --subheading-color: #cbd5e1;
            --body-color: #94a3b8;
            --muted-color: #94a3b8;
            --inline-code-color: #f472b6;
            --error-bg: rgba(127, 29, 29, 0.25);
            --error-border: #7f1d1d;
            --error-color: #fca5a5;
            --backdrop-color: rgba(0, 0, 0, 0.6);
            --lightbox-bg: rgba(15, 23, 42, 0.97);
            --search-flash-bg: rgba(255, 154, 46, 0.16);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--page-bg);
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 320px;
            background-color: var(--secondary-color);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            position: fixed;
            height: 100vh;
            z-index: 200;
        }

        .content {
            flex: 1;
            margin-left: 320px;
            padding: 40px 60px;
            max-width: calc(100% - 320px);
        }

        .content-inner {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 220px;
            gap: 48px;
            align-items: start;
        }

        .content-inner.no-toc {
            grid-template-columns: minmax(0, 1fr);
        }

        .content-inner.no-toc .toc {
            display: none;
        }

        /* Search bar stays pinned to the top of the viewport while reading */
        .content-toolbar {
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
            min-width: 0;
            margin-bottom: 12px;
            padding: 12px 0;
            background: var(--page-bg);
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .content-toolbar.stuck {
            border-bottom-color: var(--border-color);
        }

        .content-toolbar .search-trigger {
            width: 100%;
            max-width: none;
            margin-bottom: 0;
        }

        .content-primary {
            grid-column: 1;
            min-width: 0;
            width: 100%;
        }

        .doc-column {
            min-width: 0;
            width: 100%;
            max-width: 100%;
        }

        .content-inner .toc {
            grid-column: 2;
            align-self: start;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 15px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .logo-mark {
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            object-fit: contain;
        }

        .logo-title {
            overflow: hidden;
            color: var(--heading-color);
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .theme-toggle {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--panel-bg);
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .theme-toggle:hover {
            border-color: var(--primary-color);
        }

        .repo-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: var(--panel-bg);
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .repo-link:hover {
            background: var(--hover-color);
            border-color: var(--primary-color);
        }

        .repo-info {
            margin: 0 0 20px 0;
            padding: 15px;
            background: var(--hover-color);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .repo-info h4 {
            margin: 0 0 10px 0;
            font-size: 12px;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-row {
            font-size: 11px;
            color: var(--body-color);
            line-height: 1.6;
            margin-bottom: 4px;
        }

        .info-row strong {
            font-weight: 600;
            min-width: 80px;
            display: inline-block;
        }

        .nav-filter {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            background: var(--panel-bg);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        .nav-filter:focus {
            border-color: var(--primary-color);
        }

        .nav-filter::placeholder {
            color: var(--muted-color);
        }

        .search-trigger {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            background: var(--panel-bg);
            color: var(--muted-color);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .search-trigger:hover,
        .search-trigger:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .search-trigger-icon {
            flex-shrink: 0;
            font-size: 13px;
        }

        .search-trigger-label {
            flex: 1;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .search-trigger-kbd {
            flex-shrink: 0;
            padding: 2px 6px;
            font-size: 11px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--secondary-color);
            color: var(--muted-color);
        }

        .search-modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 500;
            background: var(--backdrop-color);
            padding: 10vh 16px 16px;
        }

        .search-modal-backdrop.open {
            display: block;
        }

        .search-modal {
            width: min(640px, 100%);
            max-height: calc(100vh - 14vh - 16px);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .search-modal-input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .search-modal-icon {
            flex-shrink: 0;
            color: var(--muted-color);
        }

        .search-modal-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 15px;
            font-family: inherit;
            color: var(--text-color);
        }

        .search-modal-input::placeholder {
            color: var(--muted-color);
        }

        .search-modal-close {
            flex-shrink: 0;
            padding: 3px 8px;
            font-size: 11px;
            font-family: inherit;
            color: var(--muted-color);
            background: var(--secondary-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            cursor: pointer;
        }

        .search-modal-close:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .search-modal-results {
            overflow-y: auto;
            padding: 8px;
        }

        .search-result-group {
            padding: 4px 0 8px;
        }

        .search-result-group + .search-result-group {
            margin-top: 2px;
            border-top: 1px solid var(--border-color);
        }

        .search-result-page-header {
            display: flex;
            align-items: center;
            gap: 10px;
            width: calc(100% - 8px);
            margin: 0 4px 6px;
            padding: 8px 10px;
            border: none;
            border-radius: 6px;
            background: var(--hover-color);
            font-family: inherit;
            text-align: left;
            cursor: pointer;
        }

        .search-result-page-header:hover .search-result-page-filename {
            color: var(--primary-color);
        }

        .search-result-page-text {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 4px;
            min-width: 0;
        }

        .search-result-page-crumbs {
            font-size: 12px;
            color: var(--muted-color);
        }

        .search-result-file-icon {
            flex-shrink: 0;
            width: 16px;
            height: 16px;
            color: var(--muted-color);
        }

        .search-result-page-filename {
            font-size: 14px;
            font-weight: 600;
            color: var(--heading-color);
            line-height: 1.4;
            word-break: break-word;
        }

        .search-result-sections {
            display: block;
        }

        .search-result-section-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            padding: 8px 12px 8px 38px;
            border: none;
            border-radius: 6px;
            background: transparent;
            text-align: left;
            font-family: inherit;
            cursor: pointer;
        }

        .search-result-section-row:hover,
        .search-result-section-row.active {
            background: var(--hover-color);
        }

        .search-result-section-heading {
            display: flex;
            align-items: baseline;
            gap: 6px;
            line-height: 1.4;
        }

        .search-result-hash {
            flex-shrink: 0;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted-color);
        }

        .search-result-section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
        }

        .search-result-snippet {
            padding-left: 14px;
            font-size: 12px;
            font-weight: 400;
            color: var(--muted-color);
            line-height: 1.45;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .search-result-snippet mark {
            font-weight: 600;
        }

        .search-result-group mark {
            background: transparent;
            color: var(--primary-color);
            font-weight: 600;
        }

        /* Section a search result opened: one tinted block from its heading
           to the next heading, fading out after a moment */
        .search-flash {
            position: absolute;
            left: -12px;
            right: -12px;
            border-left: 3px solid var(--primary-color);
            border-radius: 4px;
            background: var(--search-flash-bg);
            pointer-events: none;
            animation: search-flash 2.4s ease-out forwards;
        }

        @keyframes search-flash {
            0%, 45% { opacity: 1; }
            100% { opacity: 0; }
        }

        .search-modal-empty {
            padding: 32px 16px;
            text-align: center;
            font-size: 13px;
            color: var(--muted-color);
        }

        .nav-section {
            margin-bottom: 12px;
        }

        .nav-section h3 {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            padding: 8px 12px;
        }

        .nav-item {
            display: block;
            padding: 10px 12px;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s ease;
            margin-bottom: 2px;
            cursor: pointer;
        }

        .nav-item:hover {
            background-color: var(--panel-bg);
            color: var(--primary-color);
        }

        .nav-item.active {
            background-color: var(--active-nav-bg);
            color: var(--active-nav-text);
        }

        .nav-item.nav-parent {
            font-weight: 600;
            font-size: 13px;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-item.nav-parent.active {
            color: var(--active-nav-text);
        }

        .nav-row {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .nav-row .nav-item {
            flex: 1;
            min-width: 0;
        }

        .nav-toggle {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            border-radius: 6px;
            padding: 0;
            color: var(--muted-color);
            cursor: pointer;
            transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
            transform: rotate(90deg);
        }

        .nav-toggle svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-toggle:hover,
        .nav-toggle:focus-visible {
            background: var(--border-color);
            color: var(--text-color);
            outline: none;
        }

        .nav-group.collapsed > .nav-row .nav-toggle {
            transform: none;
        }

        .nav-group.collapsed > .nav-children {
            display: none;
        }

        .nav-children {
            margin-left: 14px;
        }

        .nav-children .nav-item {
            font-size: 13px;
            padding: 8px 12px;
        }

        .nav-children .nav-children .nav-item {
            font-size: 12px;
            padding: 6px 10px;
        }

        .nav-hidden {
            display: none !important;
        }

        #navigation.filtering .nav-group.filter-open > .nav-children {
            display: block;
        }

        .markdown-content {
            position: relative;
            max-width: 100%;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            scroll-margin-top: 80px;
        }

        .markdown-content h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--heading-color);
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .markdown-content h2 {
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-color);
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .markdown-content h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--subheading-color);
            margin-top: 2rem;
            margin-bottom: 0.75rem;
        }

        .markdown-content h4 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--subheading-color);
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .markdown-content p {
            margin-bottom: 1rem;
            color: var(--body-color);
        }

        .markdown-content ul, .markdown-content ol {
            margin-bottom: 1rem;
            padding-left: 2rem;
        }

        .markdown-content li {
            margin-bottom: 0.5rem;
            color: var(--body-color);
        }

        .markdown-content code {
            background-color: var(--code-bg);
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            color: var(--inline-code-color);
        }

        .code-block {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .markdown-content pre {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1.25rem;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .code-block pre {
            margin-bottom: 0;
        }

        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
            font-size: 0.875rem;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 10px;
            font-size: 12px;
            font-family: inherit;
            color: var(--muted-color);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s ease, border-color 0.15s ease;
        }

        .code-block:hover .copy-btn,
        .copy-btn:focus {
            opacity: 1;
        }

        @media (hover: none) {
            .copy-btn {
                opacity: 1;
            }
        }

        .copy-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .copy-btn.copied {
            color: #16a34a;
            border-color: #16a34a;
            opacity: 1;
        }

        .markdown-content blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 1rem;
            margin: 1.5rem 0;
            font-style: italic;
            color: var(--muted-color);
            background: var(--hover-color);
            padding: 1rem 1rem 1rem 1.5rem;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .markdown-content th, .markdown-content td {
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            text-align: left;
        }

        .markdown-content th {
            background-color: var(--secondary-color);
            font-weight: 600;
            color: var(--text-color);
        }

        .markdown-content tr:hover {
            background-color: var(--hover-color);
        }

        .markdown-content a {
            color: var(--primary-color);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .markdown-content a:hover {
            border-bottom-color: var(--primary-color);
        }

        .markdown-content img {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }

        .mermaid {
            position: relative;
            margin: 2rem 0;
            padding: 1.5rem;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            overflow-x: auto;
        }

        .mermaid svg {
            max-width: 100%;
            height: auto;
        }

        .mermaid.zoomable svg {
            cursor: zoom-in;
        }

        .mermaid-expand {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            line-height: 1;
            color: var(--muted-color);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s ease, border-color 0.15s ease;
        }

        .mermaid:hover .mermaid-expand,
        .mermaid-expand:focus {
            opacity: 1;
        }

        @media (hover: none) {
            .mermaid-expand {
                opacity: 1;
            }
        }

        .mermaid-expand:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .mermaid-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 700; /* above the chat panel, whose answers open diagrams too */
            background: var(--lightbox-bg);
        }

        .mermaid-lightbox.open {
            display: block;
        }

        .lightbox-canvas {
            position: absolute;
            inset: 0;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .lightbox-canvas.dragging {
            cursor: grabbing;
        }

        /* Own GPU layer while panning, so the SVG is not repainted on every move;
           dropped on release so the diagram re-renders sharp at its zoom. */
        .lightbox-canvas.dragging .lightbox-stage {
            will-change: transform;
        }

        .lightbox-stage {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }

        .lightbox-toolbar {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 2;
            display: flex;
            gap: 8px;
        }

        .lightbox-toolbar button {
            min-width: 38px;
            height: 38px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-family: inherit;
            color: var(--text-color);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            transition: border-color 0.15s ease, color 0.15s ease;
        }

        .lightbox-toolbar button:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .lightbox-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            padding: 6px 14px;
            font-size: 12px;
            color: var(--muted-color);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            pointer-events: none;
        }

        .mermaid-error {
            padding: 1rem;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 0.5rem;
            color: var(--error-color);
            font-size: 0.875rem;
        }

        .mermaid-error details {
            margin-top: 0.5rem;
        }

        .mermaid-error summary {
            cursor: pointer;
            font-weight: 500;
        }

        .mermaid-error pre {
            margin-top: 0.5rem;
            padding: 0.75rem;
            background: var(--code-bg);
            border-radius: 0.375rem;
            overflow-x: auto;
            color: var(--text-color);
            font-size: 0.8rem;
        }

        .toc {
            position: sticky;
            top: 40px;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            font-size: 13px;
            padding-bottom: 20px;
        }

        .toc-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted-color);
            margin-bottom: 8px;
        }

        .toc-link {
            display: block;
            padding: 4px 0 4px 12px;
            color: var(--muted-color);
            text-decoration: none;
            border-left: 2px solid var(--border-color);
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .toc-link.toc-h3 {
            padding-left: 24px;
        }

        .toc-link:hover {
            color: var(--primary-color);
        }

        .toc-link.active {
            color: var(--primary-color);
            border-left-color: var(--primary-color);
            font-weight: 500;
        }

        .pager {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .pager:empty {
            display: none;
        }

        .pager-link {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-decoration: none;
            max-width: 48%;
            transition: border-color 0.2s, background 0.2s;
        }

        .pager-link:hover {
            border-color: var(--primary-color);
            background: var(--hover-color);
        }

        .pager-next {
            margin-left: auto;
            text-align: right;
        }

        .pager-label {
            font-size: 12px;
            color: var(--muted-color);
        }

        .pager-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--primary-color);
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 10rem;
            padding: 1.5rem 0;
            color: var(--muted-color);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--secondary-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            padding: 2rem;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 0.5rem;
            color: var(--error-color);
            margin: 2rem 0;
        }

        .error h3 {
            margin-bottom: 0.5rem;
        }

        .menu-toggle {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 300;
            width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--panel-bg);
            color: var(--text-color);
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--backdrop-color);
            z-index: 150;
        }

        .backdrop.visible {
            display: block;
        }

        @media (max-width: 1280px) {
            .content-inner {
                grid-template-columns: minmax(0, 1fr);
            }

            .toc {
                display: none;
            }
        }

        @media (max-width: 1024px) {
            .menu-toggle {
                display: flex;
            }

            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                box-shadow: 0 0 24px rgba(0, 0, 0, 0.2);
            }

            .sidebar.open {
                transform: none;
            }

            .content {
                margin-left: 0;
                padding: 0 20px 20px;
                max-width: 100%;
            }

            /* leave room for the fixed menu button on the left */
            .content-toolbar {
                padding-left: 52px;
            }
        }

        /* ---------- Ask AI chat (talks to `codewiki serve` on this machine) ---------- */
        .content-toolbar {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .content-toolbar .search-trigger {
            flex: 1;
        }

        .chat-trigger {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            background: var(--panel-bg);
            color: var(--text-color);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .chat-trigger:hover,
        .chat-trigger:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .chat-panel {
            --chat-gutter: 20px; /* one side margin for header, messages and input */
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 600;
            width: min(440px, 100vw);
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            box-shadow: -12px 0 40px rgba(0, 0, 0, 0.18);
            transform: translateX(100%);
            /* Hidden once slid away: no shadow on the page edge, no Tab stops. */
            visibility: hidden;
            transition: transform 0.2s ease, visibility 0s linear 0.2s;
        }

        .chat-panel.open {
            transform: none;
            visibility: visible;
            transition: transform 0.2s ease;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px var(--chat-gutter);
            border-bottom: 1px solid var(--border-color);
        }

        .chat-title {
            font-weight: 600;
            color: var(--heading-color);
        }

        .chat-freshness {
            flex: 1;
            font-size: 11px;
            color: var(--muted-color);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-close,
        .chat-new {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 12px;
            background: transparent;
            color: var(--muted-color);
            cursor: pointer;
        }

        .chat-close {
            display: inline-flex;
            align-items: center;
            padding: 3px 6px;
        }

        .chat-close svg,
        .chat-action svg,
        .chat-send svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .chat-close:hover,
        .chat-new:hover {
            color: var(--text-color);
            border-color: var(--primary-color);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            scrollbar-gutter: stable;
            padding: 16px var(--chat-gutter);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .chat-turn {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-turn.user {
            align-items: flex-end;
        }

        .chat-msg {
            min-width: 0;
            max-width: 100%;
            font-size: 14px;
            line-height: 1.6;
            color: var(--body-color);
            overflow-wrap: break-word;
        }

        .chat-msg > :first-child {
            margin-top: 0;
        }

        .chat-msg > :last-child {
            margin-bottom: 0;
        }

        .chat-msg p,
        .chat-msg ul,
        .chat-msg ol {
            margin: 0 0 10px;
        }

        .chat-msg ul,
        .chat-msg ol {
            padding-left: 22px;
        }

        .chat-msg h1,
        .chat-msg h2,
        .chat-msg h3,
        .chat-msg h4 {
            margin: 14px 0 8px;
            font-size: 15px;
            color: var(--heading-color);
        }

        .chat-msg :not(pre) > code {
            overflow-wrap: anywhere;
        }

        .chat-msg.user {
            max-width: 85%;
            padding: 8px 12px;
            border-radius: 12px 12px 2px 12px;
            background: var(--secondary-color);
            color: var(--text-color);
            white-space: pre-wrap;
        }

        .chat-msg.assistant pre {
            max-width: 100%;
            margin: 10px 0;
            padding: 10px 12px;
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--code-bg);
            font-size: 12px;
        }

        .chat-msg.assistant pre code {
            padding: 0;
            background: none;
        }

        .chat-msg table {
            display: block;
            max-width: 100%;
            margin: 10px 0;
            overflow-x: auto;
            border-collapse: collapse;
            font-size: 13px;
        }

        .chat-msg th,
        .chat-msg td {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            text-align: left;
            vertical-align: top;
        }

        .chat-msg th {
            background: var(--secondary-color);
        }

        /* Names stay whole in table cells; a wide table scrolls instead. */
        .chat-msg td code,
        .chat-msg th code {
            white-space: nowrap;
            overflow-wrap: normal;
        }

        .chat-msg .mermaid {
            margin: 10px 0;
            overflow-x: auto;
        }

        .chat-msg.notice {
            font-size: 13px;
            font-style: italic;
            color: var(--muted-color);
        }

        .chat-actions {
            display: flex;
            gap: 2px;
            margin: 4px -6px 0; /* icons line up with the text above */
            opacity: 0.7;
            transition: opacity 0.15s;
        }

        .chat-turn:hover .chat-actions,
        .chat-actions:focus-within {
            opacity: 1;
        }

        .chat-action {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 6px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--muted-color);
            font: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        .chat-action:hover,
        .chat-action:focus-visible {
            background: var(--secondary-color);
            color: var(--text-color);
            outline: none;
        }

        .chat-edit {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 85%;
        }

        .chat-edit .chat-input {
            resize: vertical;
        }

        .chat-edit-actions {
            display: flex;
            justify-content: flex-end;
            gap: 6px;
        }

        .chat-edit-actions .chat-send {
            padding: 4px 12px;
        }

        .chat-progress {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 13px;
            color: var(--body-color);
        }

        .chat-progress-head {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-progress-time {
            margin-left: auto;
            font-variant-numeric: tabular-nums;
            color: var(--muted-color);
        }

        .chat-steps {
            margin: 8px 0 0;
            padding: 0;
            list-style: none;
        }

        .chat-steps li {
            display: flex;
            gap: 8px;
            padding: 2px 0;
        }

        .chat-steps li.done {
            color: var(--muted-color);
        }

        .chat-step-mark {
            width: 12px;
            flex-shrink: 0;
            text-align: center;
        }

        .chat-steps li.current .chat-step-mark {
            color: var(--primary-color);
        }

        .chat-step-text {
            flex: 1;
            min-width: 0;
        }

        .chat-step-time {
            font-variant-numeric: tabular-nums;
            color: var(--muted-color);
        }

        .chat-progress-hint {
            margin-top: 8px;
            font-size: 12px;
            color: var(--muted-color);
        }

        .chat-spinner {
            width: 12px;
            height: 12px;
            flex-shrink: 0;
            border: 2px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: chat-spin 0.8s linear infinite;
        }

        @keyframes chat-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .chat-spinner {
                animation: none;
            }
        }

        .chat-msg.error {
            padding: 8px 12px;
            border: 1px solid var(--error-border);
            border-radius: 8px;
            background: var(--error-bg);
            color: var(--error-color);
        }

        .chat-msg a.chat-cite {
            text-decoration: none;
            border-bottom: 1px dotted var(--primary-color);
        }

        .chat-sources {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .chat-source {
            font-size: 11px;
            padding: 2px 8px;
            border: 1px solid var(--border-color);
            border-radius: 999px;
            color: var(--muted-color);
            text-decoration: none;
            cursor: pointer;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-source.stale {
            border-style: dashed;
        }

        .chat-stats {
            margin-top: 6px;
            font-size: 11px;
            color: var(--muted-color);
        }

        .chat-status {
            min-height: 18px;
            padding: 0 var(--chat-gutter) 6px;
            font-size: 12px;
            color: var(--muted-color);
        }

        .chat-form {
            display: flex;
            gap: 8px;
            padding: 12px var(--chat-gutter) 16px;
            border-top: 1px solid var(--border-color);
        }

        .chat-input {
            flex: 1;
            min-height: 40px;
            max-height: 160px;
            resize: vertical;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font: inherit;
            font-size: 14px;
            background: var(--page-bg);
            color: var(--text-color);
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .chat-send {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 14px;
            border: 1px solid var(--primary-color);
            border-radius: 8px;
            background: var(--primary-color);
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .chat-send.stop {
            border-color: var(--border-color);
            background: var(--panel-bg);
            color: var(--text-color);
        }

        .chat-send.stop svg {
            fill: currentColor;
        }

        .chat-trigger {
            position: relative;
        }

        .chat-trigger.busy .chat-trigger-icon {
            animation: chat-pulse 1.2s ease-in-out infinite;
        }

        .chat-trigger.unread::after {
            content: '';
            position: absolute;
            top: -3px;
            right: -3px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--primary-color);
            border: 2px solid var(--page-bg);
        }

        @keyframes chat-pulse {
            50% {
                opacity: 0.35;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .chat-trigger.busy .chat-trigger-icon {
                animation: none;
            }
        }

        .chat-send:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .chat-offline {
            font-size: 14px;
            color: var(--body-color);
        }

        .chat-offline pre {
            position: relative;
            padding: 10px 12px;
            border-radius: 8px;
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            font-size: 13px;
        }

        .stale-banner {
            margin-bottom: 16px;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            border-radius: 6px;
            background: var(--secondary-color);
            font-size: 13px;
            color: var(--text-color);
        }

        @media (max-width: 768px) {
            .chat-trigger-label {
                display: none;
            }
        }
    </style>
</head>
<body>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Toggle navigation">☰</button>
    <div class="backdrop" id="backdrop"></div>

    <div class="search-modal-backdrop" id="search-modal-backdrop">
        <div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-label="Search documentation">
            <div class="search-modal-input-row">
                <span class="search-modal-icon">🔎</span>
                <input type="text" class="search-modal-input" id="search-modal-input" placeholder="Search documentation…" autocomplete="off" spellcheck="false">
                <button class="search-modal-close" id="search-modal-close" type="button" aria-label="Close search">Esc</button>
            </div>
            <div class="search-modal-results" id="search-modal-results"></div>
        </div>
    </div>

    <aside class="chat-panel" id="chat-panel" aria-label="Ask AI" aria-hidden="true">
        <div class="chat-header">
            <span class="chat-title">Ask AI</span>
            <span class="chat-freshness" id="chat-freshness"></span>
            <button class="chat-new" id="chat-new" type="button" title="Start a new conversation">New</button>
            <button class="chat-close" id="chat-close" type="button" aria-label="Minimize chat" title="Minimize (Esc)">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
            </button>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-status" id="chat-status" aria-live="polite"></div>
        <form class="chat-form" id="chat-form">
            <textarea class="chat-input" id="chat-input" rows="2" placeholder="Ask about the code, e.g. what breaks if I rename X?" aria-label="Your question"></textarea>
            <button class="chat-send" id="chat-send" type="submit">Ask</button>
        </form>
    </aside>

    <div class="container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="logo">
                    <img class="logo-mark" src="codewiki-icon.png" alt="CodeWiki">
                    <span class="logo-title">{{TITLE}}</span>
                </div>
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
            </div>
            {{REPO_LINK}}

            <div class="repo-info" id="repo-info" style="display: {{SHOW_INFO}};">
                <h4>Generation Info</h4>
                <div id="info-content">{{INFO_CONTENT}}</div>
            </div>

            <input type="search" class="nav-filter" id="nav-filter" placeholder="Filter pages…" aria-label="Filter pages" autocomplete="off">

            <div class="nav-section">
                <div class="nav-item active" data-file="overview.md" id="nav-overview">
                    📄 Overview
                </div>
            </div>

            <div id="navigation"></div>
        </nav>

        <main class="content">
            <div class="content-inner no-toc">
                <div class="content-primary">
                    <div class="content-toolbar">
                        <button class="search-trigger" id="search-trigger" type="button" aria-label="Search documentation">
                            <span class="search-trigger-icon">🔎</span>
                            <span class="search-trigger-label">Search docs…</span>
                            <span class="search-trigger-kbd">Ctrl K</span>
                        </button>
                        <button class="chat-trigger" id="chat-trigger" type="button" aria-label="Ask AI about this codebase">
                            <span class="chat-trigger-icon">💬</span>
                            <span class="chat-trigger-label">Ask AI</span>
                        </button>
                    </div>
                    <div class="doc-column">
                        <div id="loading" class="loading">
                            <div class="loading-spinner"></div>
                            <p>Loading documentation...</p>
                        </div>

                        <div id="content" class="markdown-content" style="display: none;"></div>

                        <nav id="pager" class="pager" aria-label="Previous and next page"></nav>
                    </div>
                </div>

                <aside class="toc" id="toc" aria-label="Table of contents">
                    <div id="toc-content"></div>
                </aside>
            </div>
        </main>
    </div>

    <script>
        // Embedded configuration
        const CONFIG = {{CONFIG_JSON}};
        const MODULE_TREE = {{MODULE_TREE_JSON}};
        const METADATA = {{METADATA_JSON}};
        // Translated page titles (first heading of each page), keyed by module name
        const PAGE_TITLES = {{PAGE_TITLES_JSON}};
        if (PAGE_TITLES.overview) {
            document.getElementById('nav-overview').textContent = '📄 ' + PAGE_TITLES.overview;
        }
        const DOCS_BASE_PATH = '{{DOCS_BASE_PATH}}';
        // Module name -> page path relative to the docs folder. Pages may sit in
        // folders mirroring the module tree (auth.md, auth/login.md) or all in
        // the docs root (--flat); a name missing here falls back to <name>.md.
        const DOC_PATHS = {{DOC_PATHS_JSON}};

        function docFileFor(key) {
            return Object.prototype.hasOwnProperty.call(DOC_PATHS, key) ? DOC_PATHS[key] : key + '.md';
        }

        // Resolve a relative link found on page `fromFile` to a docs-relative path.
        function resolveDocLink(fromFile, href) {
            const parts = (fromFile || '').split('/').slice(0, -1).concat(href.split('/'));
            const out = [];
            for (const part of parts) {
                if (part === '..') {
                    out.pop();
                } else if (part && part !== '.') {
                    out.push(part);
                }
            }
            const resolved = out.join('/');
            const known = Object.values(DOC_PATHS);
            if (known.length === 0 || known.indexOf(resolved) !== -1) {
                return resolved;
            }
            // A link that misses its page: match the page by module name.
            const stem = resolved.split('/').pop().replace(/\.md$/i, '');
            return Object.prototype.hasOwnProperty.call(DOC_PATHS, stem) ? DOC_PATHS[stem] : resolved;
        }

        // Router / rendering state
        let currentFile = null;
        let loadToken = 0;
        let scrollSpyObserver = null;

        // ---------- Search state ----------
        // SEARCH_INDEX: raw section records fetched from search_index.json
        // (null = not fetched yet, [] = fetched but empty/unavailable).
        // SEARCH_VOCAB: precomputed BM25 statistics built once after fetch.
        let SEARCH_INDEX = null;
        let SEARCH_VOCAB = null;
        let searchResults = [];
        let searchActiveIndex = -1;
        let searchDebounceTimer = null;

        // Initialize marked. headerIds/mangle were removed in marked v5+;
        // GitHub-compatible heading ids come from the marked-gfm-heading-id
        // extension (wraps github-slugger), matching the anchors used in
        // cross-document links inside the generated docs.
        marked.setOptions({
            breaks: true,
            gfm: true
        });
        if (typeof markedGfmHeadingId !== 'undefined') {
            marked.use(markedGfmHeadingId.gfmHeadingId());
        }

        if (typeof hljs !== 'undefined') {
            hljs.configure({ ignoreUnescapedHTML: true });
        }

        function isDarkTheme() {
            return document.documentElement.getAttribute('data-theme') === 'dark';
        }

        function initMermaid() {
            const config = {
                startOnLoad: false,
                suppressErrorRendering: true,
                theme: isDarkTheme() ? 'dark' : 'default',
                flowchart: { htmlLabels: true, curve: 'basis' },
                sequence: { mirrorActors: true, useMaxWidth: true }
            };
            if (!isDarkTheme()) {
                config.themeVariables = {
                    primaryColor: '#2563eb',
                    primaryTextColor: '#334155',
                    primaryBorderColor: '#e2e8f0',
                    lineColor: '#64748b',
                    secondaryColor: '#f1f5f9',
                    tertiaryColor: '#f8fafc'
                };
            }
            mermaid.initialize(config);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            if (MODULE_TREE) {
                buildNavigation();
            }

            setupNavFilter();
            setupThemeToggle();
            setupMobileDrawer();
            setupLinkInterception();
            setupSearchModal();
            setupChat();
            setupStickyToolbar();
            initMermaid();

            window.addEventListener('hashchange', onHashChange);
            if (!location.hash) {
                history.replaceState(null, '', buildHash('overview.md'));
            }
            onHashChange();
        });

        // ---------- Hash routing ----------
        // URL scheme: #/<encodeURIComponent(filename)> or
        //             #/<encodeURIComponent(filename)>:<heading-slug>
        // encodeURIComponent escapes both '&' and ':' in filenames, and GitHub
        // slugs never contain ':', so splitting on the first ':' is unambiguous.
        // The leading '#/' distinguishes router hashes from plain in-page anchors.

        function buildHash(file, anchor) {
            return '#/' + encodeURIComponent(file) + (anchor ? ':' + anchor : '');
        }

        function parseHash() {
            const hash = location.hash;
            if (hash && hash.indexOf('#/') === 0) {
                const raw = hash.slice(2);
                const sep = raw.indexOf(':');
                const filePart = sep === -1 ? raw : raw.slice(0, sep);
                const anchor = sep === -1 ? null : safeDecode(raw.slice(sep + 1));
                try {
                    const file = decodeURIComponent(filePart);
                    if (file) {
                        return { file: file, anchor: anchor || null };
                    }
                } catch (e) {
                    // Malformed hash: fall through to the overview
                }
            }
            return { file: 'overview.md', anchor: null };
        }

        function navigateTo(file, anchor) {
            closeDrawer();
            const target = buildHash(file, anchor);
            if (location.hash === target) {
                // Same URL (e.g. clicking the current link again): re-run manually
                onHashChange();
            } else {
                location.hash = target;
            }
        }

        function onHashChange() {
            const route = parseHash();
            if (route.file !== currentFile) {
                loadDocument(route.file, route.anchor);
            } else if (route.anchor) {
                scrollToAnchor(route.anchor);
            } else {
                window.scrollTo(0, 0);
            }
            setActiveNav(route.file);
        }

        function scrollToAnchor(anchor) {
            if (!anchor) return;
            const el = document.getElementById(anchor);
            if (el) {
                el.scrollIntoView({ block: 'start' });
                if (pendingSectionFlash === anchor) {
                    flashSection(el);
                }
            }
            pendingSectionFlash = null;
        }

        // ---------- Sidebar navigation ----------

        function buildNavigation() {
            const nav = document.getElementById('navigation');
            let html = '';

            for (const [key, data] of Object.entries(MODULE_TREE)) {
                html += buildNavItem(key, data, 0);
            }

            nav.innerHTML = html;

            // Delegated handlers for nav items and collapse toggles
            document.getElementById('sidebar').addEventListener('click', function(e) {
                const toggle = e.target.closest('.nav-toggle');
                if (toggle) {
                    toggle.closest('.nav-group').classList.toggle('collapsed');
                    return;
                }
                const item = e.target.closest('.nav-item');
                if (item) {
                    const file = item.getAttribute('data-file');
                    if (file) {
                        navigateTo(file);
                    }
                }
            });
        }

        function buildNavItem(key, data, depth) {
            const fileName = docFileFor(key);
            const hasChildren = data.children && Object.keys(data.children).length > 0;
            const hasComponents = data.components && data.components.length > 0;

            // Every module in the tree has a generated doc (parents get a
            // synthesized overview), so render a link whenever the node has
            // components or children. Only the synthetic fallback tree's bare
            // top-level node stays a plain header.
            let inner;
            if (depth === 0 && !hasChildren && !hasComponents) {
                inner = '<h3>' + escapeHtml(formatNavTitle(key)) + '</h3>';
            } else {
                const parentClass = depth === 0 && hasChildren ? ' nav-parent' : '';
                inner = '<div class="nav-item' + parentClass + '" data-file="' + escapeHtml(fileName) + '">' +
                    escapeHtml(formatNavTitle(key)) + '</div>';
            }

            if (!hasChildren) {
                return '<div class="nav-leaf">' + inner + '</div>';
            }

            let childrenHtml = '';
            for (const [childKey, childData] of Object.entries(data.children)) {
                childrenHtml += buildNavItem(childKey, childData, depth + 1);
            }

            // Top-level groups start expanded, deeper groups collapsed
            const collapsed = depth >= 1 ? ' collapsed' : '';
            return '<div class="nav-group' + collapsed + '">' +
                '<div class="nav-row">' + inner +
                '<button class="nav-toggle" type="button" aria-label="Toggle section">' +
                '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg></button></div>' +
                '<div class="nav-children">' + childrenHtml + '</div></div>';
        }

        function formatNavTitle(key) {
            if (Object.prototype.hasOwnProperty.call(PAGE_TITLES, key)) {
                return PAGE_TITLES[key];
            }
            return key
                .replace(/_/g, ' ')
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        function setActiveNav(filename) {
            let active = null;
            document.querySelectorAll('.nav-item').forEach(item => {
                const isActive = item.getAttribute('data-file') === filename;
                item.classList.toggle('active', isActive);
                if (isActive) active = item;
            });

            // Reveal the active item by expanding its ancestor groups
            let group = active && active.closest('.nav-group');
            while (group) {
                group.classList.remove('collapsed');
                group = group.parentElement && group.parentElement.closest('.nav-group');
            }
            if (active) revealInSidebar(active);
        }

        // Scroll the sidebar so the current page's entry is visible (centered
        // when it was out of view), e.g. after following a cross-link.
        function revealInSidebar(item) {
            if (!item.offsetParent) return; // hidden by the page filter
            const sidebar = document.getElementById('sidebar');
            const box = sidebar.getBoundingClientRect();
            const rect = item.getBoundingClientRect();
            if (rect.top >= box.top + 8 && rect.bottom <= box.bottom - 8) return;
            sidebar.scrollTo({
                top: sidebar.scrollTop + rect.top - box.top - (box.height - rect.height) / 2,
                behavior: currentFile ? 'smooth' : 'auto'
            });
        }

        // Outline the pinned search bar once content scrolls beneath it.
        function setupStickyToolbar() {
            const toolbar = document.querySelector('.content-toolbar');
            const update = function() {
                toolbar.classList.toggle('stuck', toolbar.getBoundingClientRect().top <= 0 && window.scrollY > 0);
            };
            window.addEventListener('scroll', update, { passive: true });
            update();
        }

        function setupNavFilter() {
            const input = document.getElementById('nav-filter');
            const nav = document.getElementById('navigation');

            input.addEventListener('input', function() {
                const query = this.value.trim().toLowerCase();
                nav.classList.toggle('filtering', !!query);

                nav.querySelectorAll('.nav-group, .nav-leaf').forEach(node => {
                    if (!query) {
                        node.classList.remove('nav-hidden', 'filter-open');
                        return;
                    }
                    // A node stays visible if its own title or any descendant
                    // title matches; matching groups are force-expanded.
                    const items = node.querySelectorAll('.nav-item');
                    let anyMatch = false;
                    items.forEach(item => {
                        if (item.textContent.toLowerCase().includes(query)) {
                            anyMatch = true;
                        }
                    });
                    node.classList.toggle('nav-hidden', !anyMatch);
                    if (node.classList.contains('nav-group')) {
                        node.classList.toggle('filter-open', anyMatch);
                    }
                });
                // The full list is back: scroll to the current page, as a cross-link does.
                // Next frame: the browser's own keep-the-caret-visible scroll after an
                // edit would cancel a scroll started now.
                const active = nav.querySelector('.nav-item.active');
                if (!query && active) requestAnimationFrame(function() { revealInSidebar(active); });
            });
        }

        // ---------- Search (Ctrl+K, BM25 over section index) ----------
        //
        // search_index.json holds one record per heading across every page:
        // {id, file, anchor, level, title, content}, where `file` is the page's
        // docs-relative path (nested in the hierarchical layout). It is fetched
        // lazily the first time the modal opens and ranked client-side, the way
        // the Next.js docs search behaves:
        //
        // - identifiers are split into words (ChangeDetectionStrategy ->
        //   change, detection, strategy) and query words also match as prefixes,
        //   so "card" finds CardComponent and "changeDet" works while typing;
        // - every query word must match the section or the page it sits on
        //   (page title and its parent modules), so "changeDetection strategy
        //   of card" lands on the "Change detection strategy" section of Card;
        // - results are grouped by page with the best section first, and opening
        //   one scrolls its heading to the top and briefly highlights the section.

        const BM25_K1 = 1.2;
        // BM25F: weight of a term occurrence per field (section heading, page
        // title and parents, body) and how much each field's length dampens
        // it, so a long section is not penalised for a match in its heading.
        const SEARCH_FIELD_WEIGHTS = { title: 4, page: 2, content: 1 };
        const SEARCH_FIELD_B = { title: 0.3, page: 0.3, content: 0.75 };
        // A query word that is only a prefix of an indexed word counts less
        const SEARCH_PREFIX_WEIGHT = 0.5;
        const SEARCH_MAX_PREFIX_EXPANSIONS = 40;
        const SEARCH_FILE_GROUP_LIMIT = 8;
        const SEARCH_SECTIONS_PER_FILE = 4;
        const SEARCH_SNIPPET_RADIUS = 80;
        const SEARCH_FLASH_MS = 2400;
        const SEARCH_STOPWORDS = new Set([
            'a', 'an', 'and', 'are', 'as', 'at', 'be', 'by', 'for', 'from', 'how', 'in', 'into',
            'is', 'it', 'of', 'on', 'or', 'the', 'to', 'what', 'when', 'where', 'which', 'with'
        ]);
        const SEARCH_WORD_RE = /[\p{L}\p{N}]+(?:[_.'\-][\p{L}\p{N}]+)*/gu;

        // Section to highlight once the page it is on has scrolled to it
        let pendingSectionFlash = null;
        let sectionFlashTimer = null;

        // Next.js docs search: document with dog-ear fold + three text lines (Lucide file-text)
        const SEARCH_FILE_ICON_SVG =
            '<svg class="search-result-file-icon" viewBox="0 0 24 24" width="16" height="16" ' +
            'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/>' +
            '<path d="M14 2v4a2 2 0 0 0 2 2h4"/>' +
            '<path d="M10 9H8"/>' +
            '<path d="M16 13H8"/>' +
            '<path d="M16 17H8"/>' +
            '</svg>';

        function setupSearchModal() {
            const trigger = document.getElementById('search-trigger');
            const backdrop = document.getElementById('search-modal-backdrop');
            const input = document.getElementById('search-modal-input');
            const closeBtn = document.getElementById('search-modal-close');
            const results = document.getElementById('search-modal-results');

            trigger.addEventListener('click', openSearchModal);
            closeBtn.addEventListener('click', closeSearchModal);

            backdrop.addEventListener('click', function(e) {
                if (e.target === backdrop) closeSearchModal();
            });

            input.addEventListener('input', function() {
                clearTimeout(searchDebounceTimer);
                const query = this.value;
                searchDebounceTimer = setTimeout(function() {
                    runSearch(query);
                }, 60);
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    moveSearchSelection(1);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    moveSearchSelection(-1);
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    // Results may still be pending behind the debounce
                    clearTimeout(searchDebounceTimer);
                    runSearch(this.value);
                    activateSearchResult(searchActiveIndex >= 0 ? searchActiveIndex : 0);
                } else if (e.key === 'Escape') {
                    closeSearchModal();
                }
            });

            results.addEventListener('click', function(e) {
                const page = e.target.closest('.search-result-page-header');
                if (page) {
                    closeSearchModal();
                    navigateTo(page.getAttribute('data-file'));
                    return;
                }
                const item = e.target.closest('.search-result-section-row');
                if (!item) return;
                activateSearchResult(parseInt(item.getAttribute('data-index'), 10));
            });

            results.addEventListener('mousemove', function(e) {
                const item = e.target.closest('.search-result-section-row');
                if (item) setSearchSelection(parseInt(item.getAttribute('data-index'), 10), false);
            });

            document.addEventListener('keydown', function(e) {
                const isMod = e.ctrlKey || e.metaKey;
                if (isMod && (e.key === 'k' || e.key === 'K')) {
                    e.preventDefault();
                    openSearchModal();
                }
            });
        }

        function openSearchModal() {
            const backdrop = document.getElementById('search-modal-backdrop');
            const input = document.getElementById('search-modal-input');
            backdrop.classList.add('open');
            input.value = '';
            input.focus();
            renderSearchResults([], '');

            if (SEARCH_INDEX === null) {
                loadSearchIndex();
            }
        }

        function closeSearchModal() {
            document.getElementById('search-modal-backdrop').classList.remove('open');
        }

        function isSearchModalOpen() {
            return document.getElementById('search-modal-backdrop').classList.contains('open');
        }

        async function loadSearchIndex() {
            const path = DOCS_BASE_PATH ? DOCS_BASE_PATH + '/search_index.json' : 'search_index.json';
            try {
                const response = await fetch(path);
                if (!response.ok) throw new Error('search_index.json not found');
                SEARCH_INDEX = await response.json();
            } catch (e) {
                console.warn('Search index unavailable:', e);
                SEARCH_INDEX = [];
            }
            buildSearchVocabulary();
            const input = document.getElementById('search-modal-input');
            if (isSearchModalOpen()) {
                runSearch(input.value);
            }
        }

        // ---- Tokenizing ----

        // Leaf words of one identifier: "ChangeDetectionStrategy.OnPush" ->
        // change, detection, strategy, on, push.
        function identifierParts(word) {
            const parts = [];
            word.split(/[_.'\-]/).forEach(function(segment) {
                segment
                    .replace(/([\p{Ll}\p{N}])(\p{Lu})/gu, '$1 $2')
                    .replace(/(\p{Lu}+)(\p{Lu}\p{Ll})/gu, '$1 $2')
                    .split(' ')
                    .forEach(function(part) {
                        if (part) parts.push(part.toLowerCase());
                    });
            });
            return parts;
        }

        // Indexed terms of `text`: each word whole, plus its segments and leaf
        // words, so both "changedetectionstrategy" and "detection" match it.
        function searchTerms(text) {
            const out = [];
            if (!text) return out;
            (text.match(SEARCH_WORD_RE) || []).forEach(function(word) {
                const terms = new Set([word.toLowerCase()]);
                word.split(/[_.'\-]/).forEach(function(segment) {
                    if (segment) terms.add(segment.toLowerCase());
                });
                identifierParts(word).forEach(function(part) { terms.add(part); });
                terms.forEach(function(t) { out.push(t); });
            });
            return out;
        }

        function countTerms(text, into) {
            const terms = searchTerms(text);
            terms.forEach(function(t) { into.set(t, (into.get(t) || 0) + 1); });
            return terms.length;
        }

        // ---- Index ----

        // Page path -> {title, crumbs}: its sidebar title and its parents' titles.
        function buildSearchPageInfo() {
            const pages = { 'overview.md': { title: pageTitleFor('overview.md'), crumbs: [] } };
            function walk(tree, crumbs) {
                for (const [key, data] of Object.entries(tree || {})) {
                    const title = formatNavTitle(key);
                    pages[docFileFor(key)] = { title: title, crumbs: crumbs };
                    if (data && data.children) {
                        walk(data.children, crumbs.concat([title]));
                    }
                }
            }
            walk(MODULE_TREE, []);
            return pages;
        }

        function buildSearchVocabulary() {
            const pages = buildSearchPageInfo();
            const docs = [];
            const df = new Map();
            const totalLengths = { title: 0, page: 0, content: 0 };

            (SEARCH_INDEX || []).forEach(function(record, i) {
                if (!pages[record.file]) {
                    pages[record.file] = { title: pageTitleFor(record.file), crumbs: [] };
                }
                const page = pages[record.file];
                const fields = { title: new Map(), page: new Map(), content: new Map() };
                const lengths = {
                    title: countTerms(record.title, fields.title),
                    page: countTerms(page.title + ' ' + page.crumbs.join(' '), fields.page),
                    content: countTerms(record.content, fields.content)
                };
                Object.keys(lengths).forEach(function(f) { totalLengths[f] += lengths[f]; });

                const seen = new Set();
                Object.values(fields).forEach(function(field) {
                    field.forEach(function(_, t) { seen.add(t); });
                });
                seen.forEach(function(t) { df.set(t, (df.get(t) || 0) + 1); });

                docs.push({
                    record: record,
                    page: page,
                    fields: fields,
                    lengths: lengths,
                    index: i,
                    titleWords: wordSequence(record.title),
                    phraseText: wordSequence(record.title + ' ' + record.content)
                });
            });

            const N = docs.length;
            const avg = {};
            Object.keys(totalLengths).forEach(function(f) {
                avg[f] = N > 0 ? (totalLengths[f] / N) || 1 : 1;
            });
            SEARCH_VOCAB = {
                docs: docs,
                df: df,
                N: N,
                avg: avg,
                terms: Array.from(df.keys()).sort(),
                pages: pages
            };
        }

        // Leaf words of `text` in order, space-separated and padded, for
        // matching word sequences: "ChangeDetectionStrategy" and "change
        // detection strategy" both become " change detection strategy ".
        function wordSequence(text) {
            const parts = [];
            ((text || '').match(SEARCH_WORD_RE) || []).forEach(function(word) {
                identifierParts(word).forEach(function(p) { parts.push(p); });
            });
            return ' ' + parts.join(' ') + ' ';
        }

        // ---- Ranking ----

        // Indexed terms a query term matches: itself (weight 1) and, from two
        // characters on, the words it is a prefix of.
        function expandTerm(term) {
            const out = [];
            if (SEARCH_VOCAB.df.has(term)) out.push([term, 1]);
            if (term.length < 2) return out;
            const terms = SEARCH_VOCAB.terms;
            let lo = 0;
            let hi = terms.length;
            while (lo < hi) {
                const mid = (lo + hi) >> 1;
                if (terms[mid] < term) lo = mid + 1; else hi = mid;
            }
            for (let i = lo; i < terms.length && out.length < SEARCH_MAX_PREFIX_EXPANSIONS; i++) {
                if (terms[i].indexOf(term) !== 0) break;
                if (terms[i] !== term) out.push([terms[i], SEARCH_PREFIX_WEIGHT]);
            }
            return out;
        }

        // Query -> one entry per meaningful word. A word matches through its
        // whole form (any prefix of an indexed word) or, for identifiers typed
        // as one word ("changeDetection"), through all of its leaf words.
        function parseSearchQuery(query) {
            let words = query.match(SEARCH_WORD_RE) || [];
            const meaningful = words.filter(function(w) { return !SEARCH_STOPWORDS.has(w.toLowerCase()); });
            if (meaningful.length > 0) words = meaningful;
            const seen = new Set();
            const parsed = [];
            words.forEach(function(word) {
                const whole = word.toLowerCase();
                if (seen.has(whole)) return;
                seen.add(whole);
                const parts = identifierParts(word);
                parsed.push({
