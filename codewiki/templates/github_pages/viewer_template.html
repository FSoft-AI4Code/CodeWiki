                    whole: expandTerm(whole),
                    parts: parts.length > 1 ? parts.map(expandTerm) : [],
                    // the parts must be adjacent: "on push", not "on" ... "push"
                    sequence: ' ' + parts.join(' '),
                    leaves: parts,
                    highlight: [whole].concat(parts.length > 1 ? parts.filter(function(p) { return p.length > 2; }) : [])
                });
            });
            return parsed;
        }

        function idf(term) {
            const df = SEARCH_VOCAB.df.get(term) || 0;
            const N = SEARCH_VOCAB.N;
            return Math.log(1 + (N - df + 0.5) / (df + 0.5));
        }

        // BM25F score of one indexed term in one section.
        function termScore(doc, term) {
            let tf = 0;
            for (const field in SEARCH_FIELD_WEIGHTS) {
                const count = doc.fields[field].get(term);
                if (!count) continue;
                const b = SEARCH_FIELD_B[field];
                const norm = 1 - b + b * (doc.lengths[field] / SEARCH_VOCAB.avg[field]);
                tf += SEARCH_FIELD_WEIGHTS[field] * count / norm;
            }
            if (!tf) return 0;
            return idf(term) * ((tf * (BM25_K1 + 1)) / (tf + BM25_K1));
        }

        // Best match of one expanded query term: {score, inTitle}.
        function expandedScore(doc, expansions) {
            let best = 0;
            let inTitle = false;
            for (let i = 0; i < expansions.length; i++) {
                const term = expansions[i][0];
                const score = expansions[i][1] * termScore(doc, term);
                if (score > best) best = score;
                if (score > 0 && doc.fields.title.has(term)) inTitle = true;
            }
            return { score: best, inTitle: inTitle };
        }

        function wordScore(doc, word) {
            const whole = expandedScore(doc, word.whole);
            if (word.parts.length === 0) return whole;
            const inPage = (' ' + doc.page.title.toLowerCase()).indexOf(word.sequence) !== -1;
            if (!inPage && doc.phraseText.indexOf(word.sequence) === -1) return whole;
            let partsScore = 0;
            let partsInTitle = true;
            for (let i = 0; i < word.parts.length; i++) {
                const part = expandedScore(doc, word.parts[i]);
                if (!part.score) return whole;
                partsScore += part.score;
                partsInTitle = partsInTitle && part.inTitle;
            }
            return partsScore > whole.score
                ? { score: partsScore, inTitle: partsInTitle }
                : whole;
        }

        function scoreSection(doc, words, query) {
            let score = 0;
            let matched = 0;
            let inTitle = 0;
            words.forEach(function(word) {
                const s = wordScore(doc, word);
                if (s.score > 0) {
                    score += s.score;
                    matched += 1;
                    if (s.inTitle) inTitle += 1;
                }
            });
            if (!matched) return { score: 0, matched: 0 };
            // Sections whose heading carries the query outrank ones that only
            // mention it, a heading that *is* the query ("Card" for "card")
            // ranks first, and words in the typed order outrank scattered ones.
            score *= 1 + inTitle / words.length;
            if (doc.titleWords === query.sequence + ' ') score *= 2;
            let pairs = 0;
            for (let i = 1; i < query.leaves.length; i++) {
                if (doc.phraseText.indexOf(' ' + query.leaves[i - 1] + ' ' + query.leaves[i] + ' ') !== -1) {
                    pairs += 1;
                }
            }
            if (pairs) score *= 1 + 0.5 * pairs / (query.leaves.length - 1);
            return { score: score, matched: matched };
        }

        function runSearch(query) {
            const trimmed = (query || '').trim();
            if (!trimmed || !SEARCH_VOCAB || SEARCH_VOCAB.N === 0) {
                renderSearchResults([], trimmed);
                return;
            }
            const words = parseSearchQuery(trimmed);
            if (words.length === 0) {
                renderSearchResults([], trimmed);
                return;
            }
            const leaves = [];
            words.forEach(function(w) { w.leaves.forEach(function(p) { leaves.push(p); }); });
            const shape = { leaves: leaves, sequence: ' ' + leaves.join(' ') };

            // Every word must match; if nothing matches all of them, fall back
            // to the sections matching the most words.
            const scored = [];
            let bestMatched = 0;
            SEARCH_VOCAB.docs.forEach(function(doc) {
                const s = scoreSection(doc, words, shape);
                if (!s.matched) return;
                bestMatched = Math.max(bestMatched, s.matched);
                scored.push({ doc: doc, score: s.score, matched: s.matched });
            });
            const kept = scored.filter(function(s) { return s.matched === bestMatched; });
            kept.sort(function(a, b) { return b.score - a.score; });

            const highlight = [];
            words.forEach(function(w) { w.highlight.forEach(function(t) { highlight.push(t); }); });
            renderSearchResults(groupSearchHitsByFile(kept), trimmed, highlight);
        }

        // Group hits by page, best page first and best section first within a
        // page, so the top row is always the best match.
        function groupSearchHitsByFile(scored) {
            const byFile = new Map();
            scored.forEach(function(s) {
                const file = s.doc.record.file;
                if (!byFile.has(file)) {
                    byFile.set(file, { file: file, page: s.doc.page, maxScore: s.score, hits: [] });
                }
                byFile.get(file).hits.push(s);
            });
            const groups = Array.from(byFile.values());
            groups.sort(function(a, b) { return b.maxScore - a.maxScore; });
            groups.forEach(function(group) {
                group.hits = group.hits.slice(0, SEARCH_SECTIONS_PER_FILE);
            });
            return groups.slice(0, SEARCH_FILE_GROUP_LIMIT);
        }

        // ---- Rendering ----

        function highlightPattern(terms) {
            const unique = Array.from(new Set(terms.filter(function(t) { return t.length > 1 || terms.length === 1; })));
            if (unique.length === 0) return null;
            unique.sort(function(a, b) { return b.length - a.length; });
            const source = unique
                .map(function(t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); })
                .join('|');
            return new RegExp('(' + source + ')', 'giu');
        }

        function highlightText(text, terms) {
            const re = highlightPattern(terms || []);
            if (!re) return escapeHtml(text);
            let html = '';
            let pos = 0;
            text.replace(re, function(match, _group, offset) {
                html += escapeHtml(text.slice(pos, offset)) + '<mark>' + escapeHtml(match) + '</mark>';
                pos = offset + match.length;
                return match;
            });
            return html + escapeHtml(text.slice(pos));
        }

        function buildSnippet(content, terms) {
            if (!content) return '';
            const re = highlightPattern(terms);
            const hit = re ? re.exec(content) : null;
            const hitAt = hit ? hit.index : 0;
            const start = Math.max(0, hitAt - SEARCH_SNIPPET_RADIUS);
            const end = start + SEARCH_SNIPPET_RADIUS * 2;
            let snippet = content.slice(start, end);
            snippet = (start > 0 ? '…' : '') + snippet + (end < content.length ? '…' : '');
            return highlightText(snippet, terms);
        }

        function buildSearchPageHeader(group, terms) {
            const crumbs = group.page.crumbs.length
                ? '<span class="search-result-page-crumbs">' +
                    escapeHtml(group.page.crumbs.join(' › ')) + ' ›</span>'
                : '';
            return (
                '<button type="button" class="search-result-page-header" data-file="' +
                escapeHtml(group.file) + '">' +
                SEARCH_FILE_ICON_SVG +
                '<span class="search-result-page-text">' + crumbs +
                '<span class="search-result-page-filename">' +
                highlightText(group.page.title, terms) +
                '</span></span></button>'
            );
        }

        function buildSearchSectionRow(record, terms, index) {
            const heading = (record.title || record.anchor || '').trim();
            const snippet = buildSnippet(record.content, terms);
            return (
                '<button type="button" class="search-result-section-row' +
                (index === searchActiveIndex ? ' active' : '') + '" data-index="' + index + '">' +
                '<span class="search-result-section-heading">' +
                '<span class="search-result-hash" aria-hidden="true">#</span>' +
                '<span class="search-result-section-title">' + highlightText(heading, terms) + '</span>' +
                '</span>' +
                (snippet ? '<span class="search-result-snippet">' + snippet + '</span>' : '') +
                '</button>'
            );
        }

        function renderSearchResults(grouped, query, terms) {
            const results = document.getElementById('search-modal-results');
            searchResults = [];
            grouped.forEach(function(group) {
                group.hits.forEach(function(s) { searchResults.push(s.doc.record); });
            });
            searchActiveIndex = searchResults.length > 0 ? 0 : -1;

            if (SEARCH_INDEX === null) {
                results.innerHTML = '<div class="search-modal-empty">Loading search index…</div>';
                return;
            }
            if (SEARCH_INDEX.length === 0) {
                results.innerHTML = '<div class="search-modal-empty">Search index unavailable for this build.</div>';
                return;
            }
            if (!query) {
                results.innerHTML = '<div class="search-modal-empty">Type to search across every page and section…</div>';
                return;
            }
            if (grouped.length === 0) {
                results.innerHTML = '<div class="search-modal-empty">No results for "' + escapeHtml(query) + '"</div>';
                return;
            }

            let html = '';
            let flatIndex = 0;
            grouped.forEach(function(group) {
                html += '<div class="search-result-group">' + buildSearchPageHeader(group, terms) +
                    '<div class="search-result-sections">';
                group.hits.forEach(function(s) {
                    html += buildSearchSectionRow(s.doc.record, terms, flatIndex);
                    flatIndex += 1;
                });
                html += '</div></div>';
            });
            results.innerHTML = html;
            results.scrollTop = 0;
        }

        function setSearchSelection(index, reveal) {
            if (index === searchActiveIndex) return;
            searchActiveIndex = index;
            document.querySelectorAll('.search-result-section-row').forEach(function(item, i) {
                item.classList.toggle('active', i === searchActiveIndex);
            });
            const active = document.querySelector('.search-result-section-row.active');
            if (active && reveal) active.scrollIntoView({ block: 'nearest' });
        }

        function moveSearchSelection(delta) {
            if (searchResults.length === 0) return;
            setSearchSelection((searchActiveIndex + delta + searchResults.length) % searchResults.length, true);
        }

        function activateSearchResult(index) {
            const record = searchResults[index];
            if (!record) return;
            closeSearchModal();
            pendingSectionFlash = record.anchor || null;
            navigateTo(record.file, record.anchor);
        }

        // Briefly highlight the section under heading `el`: the heading and
        // everything up to the next heading, i.e. the text the search matched.
        function flashSection(el) {
            const content = document.getElementById('content');
            document.querySelectorAll('.search-flash').forEach(function(node) { node.remove(); });
            clearTimeout(sectionFlashTimer);
            let last = el;
            while (last.nextElementSibling && !/^H[1-6]$/.test(last.nextElementSibling.tagName)) {
                last = last.nextElementSibling;
            }
            const box = content.getBoundingClientRect();
            const top = el.getBoundingClientRect().top - box.top - 6;
            const bottom = last.getBoundingClientRect().bottom - box.top + 6;
            const overlay = document.createElement('div');
            overlay.className = 'search-flash';
            overlay.style.top = top + 'px';
            overlay.style.height = (bottom - top) + 'px';
            content.appendChild(overlay);
            sectionFlashTimer = setTimeout(function() { overlay.remove(); }, SEARCH_FLASH_MS);
        }

        // ---------- Document loading & rendering ----------

        async function loadDocument(filename, anchor) {
            const token = ++loadToken;
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');

            closeMermaidLightbox();

            loading.style.display = 'flex';
            content.style.display = 'none';

            try {
                const docPath = DOCS_BASE_PATH ? DOCS_BASE_PATH + '/' + filename : filename;
                const response = await fetch(docPath);
                if (!response.ok) {
                    throw new Error('Failed to load ' + filename);
                }

                const markdown = await response.text();
                if (token !== loadToken) return; // superseded by a newer navigation

                content.innerHTML = renderMarkdown(markdown);
                loading.style.display = 'none';
                content.style.display = 'block';
                currentFile = filename;

                highlightCodeBlocks();
                addCopyButtons();

                await renderMermaidDiagrams();
                if (token !== loadToken) return;

                buildTOC();
                renderPagerLinks(filename);
                showStaleBanner(filename);

                // Scroll after diagrams render, since they shift the layout
                if (anchor) {
                    scrollToAnchor(anchor);
                } else {
                    window.scrollTo(0, 0);
                }

            } catch (error) {
                console.error('Error loading document:', error);
                if (token === loadToken) {
                    showError('Failed to load document: ' + filename);
                }
            }
        }

        function setupLinkInterception() {
            // One delegated listener covers markdown content, the TOC and
            // any other internal links.
            document.addEventListener('click', function(e) {
                const link = e.target.closest('a');
                if (!link) return;

                const href = link.getAttribute('href');
                if (!href) return;

                // Router hashes (e.g. pager links): let the browser update the
                // hash and the hashchange handler do the rest.
                if (href.indexOf('#/') === 0) return;

                // Plain in-page anchors (TOC, intra-document links): scroll and
                // keep the URL shareable without triggering a reload.
                if (href.charAt(0) === '#') {
                    e.preventDefault();
                    const slug = safeDecode(href.slice(1));
                    scrollToAnchor(slug);
                    if (currentFile && slug) {
                        history.replaceState(null, '', buildHash(currentFile, slug));
                    }
                    return;
                }

                // Relative markdown links, optionally with an anchor
                // (e.g. "Other_Module.md#some-section")
                if (/^https?:/i.test(href)) return;
                if (/^[a-z][a-z0-9+.-]*:/i.test(href) || href.charAt(0) === '/') return;
                const mdMatch = href.match(/^([^#?]*\.md)(?:#(.*))?$/i);
                if (mdMatch) {
                    e.preventDefault();
                    e.stopPropagation();
                    const filename = resolveDocLink(currentFile || 'overview.md', safeDecode(mdMatch[1]));
                    const anchor = mdMatch[2] ? safeDecode(mdMatch[2]) : null;
                    navigateTo(filename, anchor);
                }
            });
        }

        function safeDecode(text) {
            try {
                return decodeURIComponent(text);
            } catch (e) {
                return text;
            }
        }

        function sanitizeHtml(html) {
            // Pages and chat answers are model-written: never let them run script.
            return window.DOMPurify ? DOMPurify.sanitize(html) : html;
        }

        function renderMarkdown(markdown) {
            // Convert markdown to HTML using marked
            let html = sanitizeHtml(marked.parse(markdown));

            // Process mermaid code blocks
            html = html.replace(
                /<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g,
                (match, code) => {
                    const decodedCode = code
                        .replace(/&lt;/g, '<')
                        .replace(/&gt;/g, '>')
                        .replace(/&amp;/g, '&')
                        .replace(/&quot;/g, '"')
                        .replace(/&#39;/g, "'");
                    return '<div class="mermaid">' + decodedCode + '</div>';
                }
            );

            return html;
        }

        function highlightCodeBlocks() {
            if (typeof hljs === 'undefined') return;
            // Only highlight fences with an explicit language tag —
            // auto-detection miscolors untagged output/log blocks.
            document.querySelectorAll('#content pre code[class*="language-"]').forEach(el => {
                if (el.classList.contains('language-mermaid')) return;
                hljs.highlightElement(el);
            });
        }

        function addCopyButtons() {
            if (!navigator.clipboard) return; // requires a secure context

            document.querySelectorAll('#content pre').forEach(pre => {
                if (pre.closest('.mermaid') || pre.closest('.mermaid-error') || pre.closest('.code-block')) return;

                // Wrap so the button doesn't scroll with wide code
                const wrapper = document.createElement('div');
                wrapper.className = 'code-block';
                pre.parentNode.insertBefore(wrapper, pre);
                wrapper.appendChild(pre);

                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.type = 'button';
                btn.textContent = 'Copy';
                btn.addEventListener('click', function() {
                    const code = pre.querySelector('code');
                    const text = code ? code.innerText : pre.innerText;
                    navigator.clipboard.writeText(text).then(() => {
                        btn.textContent = 'Copied!';
                        btn.classList.add('copied');
                        setTimeout(() => {
                            btn.textContent = 'Copy';
                            btn.classList.remove('copied');
                        }, 1500);
                    });
                });
                wrapper.appendChild(btn);
            });
        }

        let mermaidRenderSeq = 0;

        // `root`: the page (default) or the chat, whose answers can hold diagrams too.
        async function renderMermaidDiagrams(root) {
            const mermaidElements = (root || document.getElementById('content')).querySelectorAll('.mermaid');

            for (let i = 0; i < mermaidElements.length; i++) {
                const element = mermaidElements[i];
                // Keep the source around so diagrams can re-render on theme change
                if (!element.dataset.src) {
                    element.dataset.src = element.textContent;
                }

                try {
                    const renderId = 'mermaid-svg-' + (++mermaidRenderSeq);
                    const { svg } = await mermaid.render(renderId, element.dataset.src);
                    element.innerHTML = svg;
                    makeMermaidZoomable(element);
                } catch (error) {
                    console.error('Mermaid rendering error:', error);
                    element.innerHTML = '<div class="mermaid-error">⚠️ Diagram failed to render' +
                        '<details><summary>Show source</summary><pre>' +
                        escapeHtml(element.dataset.src) + '</pre></details></div>';
                }
            }
        }

        // ---------- Mermaid full-screen lightbox with pan & zoom ----------

        let lightboxEl = null;
        const lightboxState = { scale: 1, tx: 0, ty: 0, width: 0, height: 0 };

        function makeMermaidZoomable(element) {
            element.classList.add('zoomable');

            const btn = document.createElement('button');
            btn.className = 'mermaid-expand';
            btn.type = 'button';
            btn.title = 'Expand diagram';
            btn.setAttribute('aria-label', 'Expand diagram');
            btn.textContent = '⛶';
            element.appendChild(btn);

            element.addEventListener('click', function(e) {
                if (e.target.closest('a')) return; // keep links inside diagrams working
                openMermaidLightbox(element);
            });
        }

        function ensureLightbox() {
            if (lightboxEl) return lightboxEl;

            lightboxEl = document.createElement('div');
            lightboxEl.className = 'mermaid-lightbox';
            lightboxEl.setAttribute('role', 'dialog');
            lightboxEl.setAttribute('aria-label', 'Diagram viewer');
            lightboxEl.innerHTML =
                '<div class="lightbox-canvas"><div class="lightbox-stage"></div></div>' +
                '<div class="lightbox-toolbar">' +
                '<button type="button" data-action="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>' +
                '<button type="button" data-action="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>' +
                '<button type="button" data-action="reset" title="Reset view" aria-label="Reset view">Fit</button>' +
                '<button type="button" data-action="close" title="Close (Esc)" aria-label="Close">✕</button>' +
                '</div>' +
                '<div class="lightbox-hint">Scroll to zoom · drag to pan · Esc to close</div>';
            document.body.appendChild(lightboxEl);

            const canvas = lightboxEl.querySelector('.lightbox-canvas');

            lightboxEl.querySelector('.lightbox-toolbar').addEventListener('click', function(e) {
                const button = e.target.closest('button');
                if (!button) return;
                const action = button.getAttribute('data-action');
                const cx = canvas.clientWidth / 2;
                const cy = canvas.clientHeight / 2;
                if (action === 'zoom-in') zoomLightboxAt(cx, cy, 1.4);
                else if (action === 'zoom-out') zoomLightboxAt(cx, cy, 1 / 1.4);
                else if (action === 'reset') fitLightbox();
                else if (action === 'close') closeMermaidLightbox();
            });

            // Wheel zoom centred on the cursor (trackpad pinch arrives as
            // ctrl+wheel and is covered by the same handler)
            canvas.addEventListener('wheel', function(e) {
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
                zoomLightboxAt(e.clientX - rect.left, e.clientY - rect.top, factor);
            }, { passive: false });

            // Drag to pan; two pointers pinch to zoom (touch)
            const pointers = new Map();
            let lastPinchDist = 0;

            canvas.addEventListener('pointerdown', function(e) {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                // Without this the drag also selects the diagram's text, which
                // makes panning stutter.
                e.preventDefault();
                canvas.setPointerCapture(e.pointerId);
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (pointers.size === 1) canvas.classList.add('dragging');
                if (pointers.size === 2) {
                    const pts = Array.from(pointers.values());
                    lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                }
            });

            canvas.addEventListener('pointermove', function(e) {
                if (!pointers.has(e.pointerId)) return;
                const prev = pointers.get(e.pointerId);
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (pointers.size === 1) {
                    lightboxState.tx += e.clientX - prev.x;
                    lightboxState.ty += e.clientY - prev.y;
                    applyLightboxTransform();
                } else if (pointers.size === 2) {
                    const pts = Array.from(pointers.values());
                    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    if (lastPinchDist > 0) {
                        const rect = canvas.getBoundingClientRect();
                        const midX = (pts[0].x + pts[1].x) / 2 - rect.left;
                        const midY = (pts[0].y + pts[1].y) / 2 - rect.top;
                        zoomLightboxAt(midX, midY, dist / lastPinchDist);
                    }
                    lastPinchDist = dist;
                }
            });

            function releasePointer(e) {
                pointers.delete(e.pointerId);
                lastPinchDist = 0;
                if (pointers.size === 0) canvas.classList.remove('dragging');
            }
            canvas.addEventListener('pointerup', releasePointer);
            canvas.addEventListener('pointercancel', releasePointer);

            // Double-click to zoom in on a spot
            canvas.addEventListener('dblclick', function(e) {
                const rect = canvas.getBoundingClientRect();
                zoomLightboxAt(e.clientX - rect.left, e.clientY - rect.top, 2);
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && lightboxEl.classList.contains('open')) {
                    closeMermaidLightbox();
                }
            });

            return lightboxEl;
        }

        function openMermaidLightbox(element) {
            const svg = element.querySelector('svg');
            if (!svg) return;

            const lb = ensureLightbox();
            const stage = lb.querySelector('.lightbox-stage');
            stage.innerHTML = '';

            const clone = svg.cloneNode(true);
            let width = 800;
            let height = 600;
            const vb = clone.viewBox && clone.viewBox.baseVal;
            if (vb && vb.width && vb.height) {
                width = vb.width;
                height = vb.height;
            }
            // Give the clone its natural size; scaling happens via transform
            clone.style.maxWidth = 'none';
            clone.style.width = width + 'px';
            clone.style.height = height + 'px';
            clone.setAttribute('width', width);
            clone.setAttribute('height', height);
            stage.style.width = width + 'px';
            stage.style.height = height + 'px';
            stage.appendChild(clone);

            lightboxState.width = width;
            lightboxState.height = height;

            lb.classList.add('open');
            document.body.style.overflow = 'hidden';
            fitLightbox();
        }

        function fitLightbox() {
            const canvas = lightboxEl.querySelector('.lightbox-canvas');
            const cw = canvas.clientWidth;
            const ch = canvas.clientHeight;
            // Fill most of the screen — small diagrams get scaled UP
            const fit = Math.min(cw * 0.9 / lightboxState.width, ch * 0.85 / lightboxState.height);
            lightboxState.scale = Math.min(Math.max(fit, 0.1), 10);
            lightboxState.tx = (cw - lightboxState.width * lightboxState.scale) / 2;
            lightboxState.ty = (ch - lightboxState.height * lightboxState.scale) / 2;
            applyLightboxTransform();
        }

        function zoomLightboxAt(x, y, factor) {
            const newScale = Math.min(Math.max(lightboxState.scale * factor, 0.1), 12);
            const applied = newScale / lightboxState.scale;
            lightboxState.tx = x - (x - lightboxState.tx) * applied;
            lightboxState.ty = y - (y - lightboxState.ty) * applied;
            lightboxState.scale = newScale;
            applyLightboxTransform();
        }

        let lightboxFrame = 0;

        // At most one transform per frame: a fast mouse sends several moves per frame.
        function applyLightboxTransform() {
            if (lightboxFrame) return;
            lightboxFrame = requestAnimationFrame(function() {
                lightboxFrame = 0;
                const stage = lightboxEl.querySelector('.lightbox-stage');
                stage.style.transform = 'translate(' + lightboxState.tx + 'px, ' + lightboxState.ty + 'px) scale(' + lightboxState.scale + ')';
            });
        }

        function closeMermaidLightbox() {
            if (!lightboxEl) return;
            lightboxEl.classList.remove('open');
            lightboxEl.querySelector('.lightbox-stage').innerHTML = '';
            document.body.style.overflow = '';
        }

        // ---------- On-page table of contents ----------

        function buildTOC() {
            const tocContent = document.getElementById('toc-content');
            const contentInner = document.querySelector('.content-inner');
            const headings = Array.from(document.querySelectorAll('#content h2, #content h3'))
                .filter(h => h.id);

            if (scrollSpyObserver) {
                scrollSpyObserver.disconnect();
                scrollSpyObserver = null;
            }

            if (headings.length < 3) {
                tocContent.innerHTML = '';
                contentInner.classList.add('no-toc');
                return;
            }

            contentInner.classList.remove('no-toc');
            let html = '<div class="toc-title">On this page</div>';
            headings.forEach(h => {
                html += '<a class="toc-link toc-' + h.tagName.toLowerCase() + '" href="#' +
                    escapeHtml(h.id) + '">' + escapeHtml(h.textContent) + '</a>';
            });
            tocContent.innerHTML = html;

            setupScrollSpy(headings);
        }

        function setupScrollSpy(headings) {
            scrollSpyObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const id = entry.target.id;
                    document.querySelectorAll('.toc-link').forEach(a => {
                        a.classList.toggle('active', a.getAttribute('href') === '#' + id);
                    });
                });
            }, { rootMargin: '0px 0px -70% 0px' });

            headings.forEach(h => scrollSpyObserver.observe(h));
        }

        // ---------- Prev/next pager ----------

        function flattenModuleTree() {
            const order = ['overview.md'];

            function walk(tree, depth) {
                for (const [key, data] of Object.entries(tree)) {
                    const hasChildren = data.children && Object.keys(data.children).length > 0;
                    const hasComponents = data.components && data.components.length > 0;
                    // Mirror buildNavItem: skip bare headers without a doc
                    if (depth > 0 || hasChildren || hasComponents) {
                        order.push(docFileFor(key));
                    }
                    if (hasChildren) {
                        walk(data.children, depth + 1);
                    }
                }
            }

            if (MODULE_TREE) {
                walk(MODULE_TREE, 0);
            }
            return order;
        }

        const DOC_ORDER = flattenModuleTree();

        function pageTitleFor(filename) {
            const base = filename.split('/').pop().replace(/\.md$/i, '');
            if (base === 'overview') {
                return PAGE_TITLES.overview || 'Overview';
            }
            return formatNavTitle(base);
        }

        function renderPagerLinks(filename) {
            const pager = document.getElementById('pager');
            const idx = DOC_ORDER.indexOf(filename);

            if (idx === -1) {
                pager.innerHTML = '';
                return;
            }

            const prev = idx > 0 ? DOC_ORDER[idx - 1] : null;
            const next = idx < DOC_ORDER.length - 1 ? DOC_ORDER[idx + 1] : null;

            let html = '';
            if (prev) {
                html += '<a class="pager-link pager-prev" href="' + buildHash(prev) + '">' +
                    '<span class="pager-label">← Previous</span>' +
                    '<span class="pager-title">' + escapeHtml(pageTitleFor(prev)) + '</span></a>';
            }
            if (next) {
                html += '<a class="pager-link pager-next" href="' + buildHash(next) + '">' +
                    '<span class="pager-label">Next →</span>' +
                    '<span class="pager-title">' + escapeHtml(pageTitleFor(next)) + '</span></a>';
            }
            pager.innerHTML = html;
        }

        // ---------- Theme ----------

        function setupThemeToggle() {
            syncThemeAssets();

            document.getElementById('theme-toggle').addEventListener('click', async function() {
                const dark = !isDarkTheme();
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                try {
                    localStorage.setItem('codewiki-theme', dark ? 'dark' : 'light');
                } catch (e) {
                    // Storage unavailable (private mode etc.) — theme just won't persist
                }

                syncThemeAssets();
                initMermaid();
                closeMermaidLightbox();

                // Re-render diagrams from their stored source in the new theme
                document.querySelectorAll('.mermaid').forEach(el => {
                    if (el.dataset.src) el.innerHTML = '';
                });
                await renderMermaidDiagrams();
                await renderMermaidDiagrams(document.getElementById('chat-messages'));
            });
        }

        function syncThemeAssets() {
            const dark = isDarkTheme();
            document.getElementById('theme-toggle').textContent = dark ? '☀️' : '🌙';

            const lightCss = document.getElementById('hljs-theme-light');
            const darkCss = document.getElementById('hljs-theme-dark');
            if (lightCss) lightCss.disabled = dark;
            if (darkCss) darkCss.disabled = !dark;
        }

        // ---------- Mobile drawer ----------

        function setupMobileDrawer() {
            document.getElementById('menu-toggle').addEventListener('click', function() {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('open');
                document.getElementById('backdrop').classList.toggle('visible', sidebar.classList.contains('open'));
            });

            document.getElementById('backdrop').addEventListener('click', closeDrawer);
        }

        function closeDrawer() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('backdrop').classList.remove('visible');
        }

        // ---------- Ask AI ----------
        // The page never holds an API key: questions go to `codewiki serve`
        // on the developer's machine, which answers with their CodeWiki config.

        const CHAT_CONFIG = (CONFIG && CONFIG.chat) || {};
        const CHAT_SESSION_KEY = 'codewiki-chat:' + (CONFIG.repository_url || document.title);
        let chatServer = null;      // {base, health} once found
        let chatBusy = false;
        let chatAbort = null;       // AbortController of the question being answered
        let chatProgress = null;    // {start, steps: [{text, start, end}]} while busy
        let chatTimer = null;
        let chatEditing = null;     // index of the question being edited
        let chatState = { sessionId: null, messages: [] };

        const CHAT_ICONS = {
            copy: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
            check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
            retry: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>',
            edit: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13 7l4 4"/></svg>',
            stop: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>'
        };

        function chatLoadState() {
            try {
                const saved = JSON.parse(sessionStorage.getItem(CHAT_SESSION_KEY) || 'null');
                if (saved && Array.isArray(saved.messages)) chatState = saved;
            } catch (e) { /* storage unavailable: start fresh */ }
        }

        function chatSaveState() {
            try { sessionStorage.setItem(CHAT_SESSION_KEY, JSON.stringify(chatState)); } catch (e) { }
        }

        function chatCandidates() {
            const out = [];
            // Served by `codewiki serve` itself: same origin, no cross-site request.
            if (location.protocol === 'http:' || location.protocol === 'https:') out.push(location.origin);
            (CHAT_CONFIG.endpoints || ['http://127.0.0.1:8765']).forEach(function(e) {
                const base = String(e).replace(/\/+$/, '');
                if (out.indexOf(base) === -1) out.push(base);
            });
            return out;
        }

        async function probeChatServer(base) {
            const ctrl = new AbortController();
            const timer = setTimeout(function() { ctrl.abort(); }, 1500);
            try {
                const r = await fetch(base + '/api/health', { signal: ctrl.signal });
                if (!r.ok) return null;
                const health = await r.json();
                return health && health.ok ? { base: base, health: health } : null;
            } catch (e) {
                return null;
            } finally {
                clearTimeout(timer);
            }
        }

        async function findChatServer(sameOriginOnly) {
            if (chatServer) return chatServer;
            const bases = chatCandidates().filter(function(b) {
                return !sameOriginOnly || b === location.origin;
            });
            for (const base of bases) {
                const found = await probeChatServer(base);
                if (found) {
                    chatServer = found;
                    renderChatFreshness();
                    return found;
                }
            }
            return null;
        }

        function renderChatFreshness() {
            const el = document.getElementById('chat-freshness');
            if (!el) return;
            el.textContent = chatServer ? chatServer.health.freshness.summary : '';
            el.title = el.textContent;
        }

        function showStaleBanner(filename) {
            if (!chatServer) return;
            const stale = chatServer.health.freshness.stale_pages || [];
            if (stale.indexOf(filename) === -1) return;
            const content = document.getElementById('content');
            if (content.querySelector('.stale-banner')) return;
            const banner = document.createElement('div');
            banner.className = 'stale-banner';
            banner.innerHTML = '⚠️ The code this page describes changed after it was written (' +
                escapeHtml(chatServer.health.freshness.summary) + '). Ask AI answers from the current ' +
                'code; refresh the page with <code>codewiki generate --update</code>.';
            content.insertBefore(banner, content.firstChild);
        }

        function codeLink(path, start, end) {
            const repo = CONFIG.repository_url;
            if (!repo) return null;
            const ref = CONFIG.commit_id || 'HEAD';
            let url = repo.replace(/\/+$/, '') + '/blob/' + ref + '/' + path;
            if (start) url += '#L' + start + (end && end !== start ? '-L' + end : '');
            return url;
        }

        // `src/x.py:L10-L20`, `src/x.py:10`, `Page.md#anchor` -> links
        const CITE_CODE_RE = /^([\w.\/-]+\.[\w]+):L?(\d+)(?:-L?(\d+))?$/;
        const CITE_PAGE_RE = /^([\w.,&()\/ -]+\.md)(?:#([\w-]+))?$/;

        function linkCitation(text) {
            let m = text.match(CITE_PAGE_RE);
            if (m) return { page: m[1], anchor: m[2] || null };
            m = text.match(CITE_CODE_RE);
            if (m) return { url: codeLink(m[1], m[2], m[3]) };
            return null;
        }

        function decorateCitations(root) {
            root.querySelectorAll('code').forEach(function(code) {
                if (code.closest('pre')) return;
                const target = linkCitation(code.textContent.trim());
                if (!target) return;
                const a = document.createElement('a');
                a.className = 'chat-cite';
                if (target.page) {
                    a.href = buildHash(target.page, target.anchor);
                    a.addEventListener('click', function(e) {
                        e.preventDefault();
                        navigateTo(target.page, target.anchor);
                    });
                } else if (target.url) {
                    a.href = target.url;
                    a.target = '_blank';
                    a.rel = 'noopener';
                } else {
                    return;
                }
                code.parentNode.insertBefore(a, code);
                a.appendChild(code);
            });
        }

        function copyText(text) {
            if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
            // Plain-http pages (another machine on the LAN) have no clipboard API.
            const area = document.createElement('textarea');
            area.value = text;
            area.setAttribute('readonly', '');
            area.style.position = 'fixed';
            area.style.opacity = '0';
            document.body.appendChild(area);
            area.select();
            try { document.execCommand('copy'); } finally { area.remove(); }
            return Promise.resolve();
        }

        function chatActionButton(icon, label, onClick) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'chat-action';
            btn.title = label;
            btn.setAttribute('aria-label', label);
            btn.innerHTML = CHAT_ICONS[icon] + '<span>' + escapeHtml(label) + '</span>';
            btn.addEventListener('click', onClick);
            return btn;
        }

        function chatCopyButton(text) {
            const btn = chatActionButton('copy', 'Copy', function() {
                copyText(text).then(function() {
                    btn.innerHTML = CHAT_ICONS.check + '<span>Copied</span>';
                    setTimeout(function() { btn.innerHTML = CHAT_ICONS.copy + '<span>Copy</span>'; }, 1500);
                });
            });
            return btn;
        }

        // The question an answer, error or "stopped" note belongs to.
        function chatQuestionIndex(index) {
            for (let i = index; i >= 0; i--) {
                if (chatState.messages[i].role === 'user') return i;
            }
            return -1;
        }

        // Turns the server remembers before message `index` (sent as keep_turns, so
        // an edited or retried question forgets the answers that came after it).
        function chatTurnsBefore(index) {
            for (let i = index - 1; i >= 0; i--) {
                const m = chatState.messages[i];
                if (m.role === 'assistant' && typeof m.turns === 'number') return m.turns;
            }
            return 0;
        }

        function retryChat(index) {
            const q = chatQuestionIndex(index);
            if (q >= 0) askChat(chatState.messages[q].text, q);
        }

        function renderChatEditor(index) {
            const msg = chatState.messages[index];
            const box = document.createElement('div');
            box.className = 'chat-edit';
            const area = document.createElement('textarea');
            area.className = 'chat-input';
            area.value = msg.text;
            area.rows = 3;
            area.setAttribute('aria-label', 'Edit your question');
            const row = document.createElement('div');
            row.className = 'chat-edit-actions';
            const cancel = document.createElement('button');
            cancel.type = 'button';
            cancel.className = 'chat-new';
            cancel.textContent = 'Cancel';
            cancel.addEventListener('click', cancelChatEdit);
            const send = document.createElement('button');
            send.type = 'button';
            send.className = 'chat-send';
            send.textContent = 'Send';
            send.addEventListener('click', function() {
                if (!area.value.trim()) return;
                chatEditing = null;
                askChat(area.value, index);
            });
            area.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    send.click();
                }
            });
            row.appendChild(cancel);
            row.appendChild(send);
            box.appendChild(area);
            box.appendChild(row);
            return box;
        }

        function cancelChatEdit() {
            chatEditing = null;
            renderChat();
            document.getElementById('chat-input').focus();
        }

        function renderChatMessage(msg, index) {
            const turn = document.createElement('div');
            turn.className = 'chat-turn ' + msg.role;
            if (msg.role === 'user' && chatEditing === index) {
                turn.appendChild(renderChatEditor(index));
                return turn;
            }
            const el = document.createElement('div');
            el.className = 'chat-msg ' + msg.role;
            turn.appendChild(el);
            const actions = document.createElement('div');
            actions.className = 'chat-actions';
            if (msg.role === 'user' || msg.role === 'error' || msg.role === 'notice') {
                el.textContent = msg.text;
            } else {
                el.innerHTML = renderMarkdown(msg.text || '');
                decorateCitations(el);
                if (typeof hljs !== 'undefined') {
                    el.querySelectorAll('pre code[class*="language-"]').forEach(function(block) {
                        hljs.highlightElement(block);
                    });
                }
                renderChatSources(el, msg);
            }
            if (msg.role !== 'notice' && msg.role !== 'error') actions.appendChild(chatCopyButton(msg.text || ''));
            if (!chatBusy) {
                if (msg.role === 'user') {
                    actions.appendChild(chatActionButton('edit', 'Edit', function() {
                        chatEditing = index;
                        renderChat();
                        const area = document.querySelector('#chat-messages .chat-edit textarea');
                        if (area) {
                            area.focus();
                            area.setSelectionRange(area.value.length, area.value.length);
                        }
                    }));
                }
                actions.appendChild(chatActionButton('retry', 'Retry', function() { retryChat(index); }));
            }
            if (actions.children.length) turn.appendChild(actions);
            return turn;
        }

        function renderChatSources(el, msg) {
            if (msg.sources && msg.sources.length) {
                const box = document.createElement('div');
                box.className = 'chat-sources';
                msg.sources.forEach(function(src) {
                    const chip = document.createElement('a');
                    chip.className = 'chat-source' + (src.stale ? ' stale' : '');
                    chip.textContent = src.location;
                    chip.title = (src.title || src.id) + (src.stale ? ' (doc older than the code)' : '');
                    const target = linkCitation(src.location);
                    if (target && target.page) {
                        chip.href = buildHash(target.page, target.anchor);
                        chip.addEventListener('click', function(e) {
                            e.preventDefault();
                            navigateTo(target.page, target.anchor);
                        });
                    } else if (target && target.url) {
                        chip.href = target.url;
                        chip.target = '_blank';
                        chip.rel = 'noopener';
                    }
                    box.appendChild(chip);
                });
                el.appendChild(box);
            }
            if (msg.stats) {
                const stats = document.createElement('div');
                stats.className = 'chat-stats';
                stats.textContent = msg.stats;
                el.appendChild(stats);
            }
        }

        function formatSeconds(ms) {
            const s = Math.max(0, Math.round(ms / 1000));
            return s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + String(s % 60).padStart(2, '0') + 's';
        }

        function renderChatProgress() {
            const now = Date.now();
            const el = document.createElement('div');
            el.className = 'chat-progress';
            el.id = 'chat-progress';
            const head = document.createElement('div');
            head.className = 'chat-progress-head';
            head.innerHTML = '<span class="chat-spinner" aria-hidden="true"></span><strong>Working on your answer</strong>' +
                '<span class="chat-progress-time">' + formatSeconds(now - chatProgress.start) + '</span>';
            el.appendChild(head);
            const list = document.createElement('ol');
            list.className = 'chat-steps';
            list.setAttribute('aria-live', 'polite');
            const steps = chatProgress.steps.length ? chatProgress.steps
                : [{ text: 'Sending your question…', start: chatProgress.start }];
            steps.forEach(function(step) {
                const li = document.createElement('li');
                const done = step.end !== undefined;
                li.className = done ? 'done' : 'current';
                const text = done ? step.text.replace(/…$/, '') : step.text;
                li.innerHTML = '<span class="chat-step-mark" aria-hidden="true">' + (done ? '✓' : '•') + '</span>' +
                    '<span class="chat-step-text">' + escapeHtml(text) + '</span>' +
                    '<span class="chat-step-time">' + formatSeconds((done ? step.end : now) - step.start) + '</span>';
                list.appendChild(li);
            });
            el.appendChild(list);
            const hint = document.createElement('div');
            hint.className = 'chat-progress-hint';
            hint.textContent = 'Each step asks the model, so a step can take a while. ' +
                'Press Esc to minimize: the answer keeps coming. Stop cancels it.';
            el.appendChild(hint);
            return el;
        }

        function updateChatProgress() {
            const old = document.getElementById('chat-progress');
            if (!chatProgress) {
                if (old) old.remove();
                return;
            }
            const box = document.getElementById('chat-messages');
            const pinned = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
            const el = renderChatProgress();
            if (old) old.replaceWith(el); else box.appendChild(el);
            if (pinned) box.scrollTop = box.scrollHeight;
        }

        function renderChat() {
            const box = document.getElementById('chat-messages');
            box.innerHTML = '';
            if (!chatState.messages.length) {
                const hint = document.createElement('div');
                hint.className = 'chat-msg assistant';
                hint.innerHTML = '<p>Ask anything about this codebase: how something works, where it ' +
                    'lives, or what breaks if you change it. Answers cite the code and pages they use.</p>';
                box.appendChild(hint);
            }
            chatState.messages.forEach(function(m, i) { box.appendChild(renderChatMessage(m, i)); });
            if (chatProgress) box.appendChild(renderChatProgress());
            if (chatEditing === null) box.scrollTop = box.scrollHeight;
            renderMermaidDiagrams(box).then(function() {
                if (chatEditing === null) box.scrollTop = box.scrollHeight;
            });
        }

        function renderChatOffline() {
            const box = document.getElementById('chat-messages');
            const port = (CHAT_CONFIG.endpoints && CHAT_CONFIG.endpoints[0] || 'http://127.0.0.1:8765')
                .replace(/^.*:(\d+).*$/, '$1');
            const cmd = 'codewiki serve --docs ' + (CHAT_CONFIG.docs_hint || 'docs') +
                (port !== '8765' ? ' --port ' + port : '');
            const safari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
            box.innerHTML = '<div class="chat-offline">' +
                '<p><strong>Chat needs CodeWiki running on your machine.</strong> In your checkout of ' +
                'this repository, run:</p><pre><code>' + escapeHtml(cmd) + '</code></pre>' +
                '<p>Then reopen this panel. Questions are answered with your own CodeWiki ' +
                'configuration; no key is stored in this page.</p>' +
                (safari && location.protocol === 'https:'
                    ? '<p>Safari blocks this site from reaching your machine. Open the docs from the ' +
                      'local server instead: <a href="http://127.0.0.1:' + escapeHtml(port) + '/">http://127.0.0.1:' +
                      escapeHtml(port) + '/</a></p>'
                    : '') +
                '</div>';
            const pre = box.querySelector('pre');
            if (pre) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'chat-new';
                btn.textContent = 'Copy';
                btn.style.marginTop = '6px';
                btn.addEventListener('click', function() {
                    copyText(cmd).then(function() { btn.textContent = 'Copied'; });
                });
                pre.after(btn);
            }
        }

        function setChatStatus(text) {
            document.getElementById('chat-status').textContent = text || '';
        }

        function isChatOpen() {
            return document.getElementById('chat-panel').classList.contains('open');
        }

        // The send button doubles as Stop; the trigger shows a question still running.
        function updateChatControls() {
            const send = document.getElementById('chat-send');
            send.classList.toggle('stop', chatBusy);
            send.innerHTML = chatBusy ? CHAT_ICONS.stop + '<span>Stop</span>' : 'Ask';
            send.setAttribute('aria-label', chatBusy ? 'Stop answering' : 'Ask');
            const trigger = document.getElementById('chat-trigger');
            trigger.classList.toggle('busy', chatBusy);
            trigger.querySelector('.chat-trigger-label').textContent = chatBusy ? 'Thinking…' : 'Ask AI';
        }

        async function openChat() {
            const panel = document.getElementById('chat-panel');
            panel.classList.add('open');
            panel.setAttribute('aria-hidden', 'false');
            document.getElementById('chat-trigger').classList.remove('unread');
            setChatStatus(chatServer ? '' : 'Looking for codewiki serve…');
            const server = await findChatServer(false);
            setChatStatus('');
            if (!server) {
                renderChatOffline();
                return;
            }
            renderChat();
            document.getElementById('chat-input').focus();
        }

        // Minimizes: a question being answered keeps going and is shown on reopening.
        function closeChat() {
            const panel = document.getElementById('chat-panel');
            if (panel.contains(document.activeElement)) document.getElementById('chat-trigger').focus();
            panel.classList.remove('open');
            panel.setAttribute('aria-hidden', 'true');
        }

        function stopChat() {
            if (chatAbort) chatAbort.abort();
        }

        // Ask `question` in place of the messages from `cutAt` on (an edit or a
        // retry); a new question is asked at the end of the conversation.
        async function askChat(question, cutAt) {
            if (chatBusy || !question.trim()) return;
            const server = await findChatServer(false);
            if (!server) {
                renderChatOffline();
                return;
            }
            if (cutAt === undefined) cutAt = chatState.messages.length;
            const keepTurns = chatTurnsBefore(cutAt);
            chatState.messages = chatState.messages.slice(0, cutAt);
            chatState.messages.push({ role: 'user', text: question });
            // "New" replaces chatState; what this question returns then goes nowhere.
            const convo = chatState;
            chatEditing = null;
            chatBusy = true;
            chatAbort = new AbortController();
            chatProgress = { start: Date.now(), steps: [] };
            chatTimer = setInterval(updateChatProgress, 1000);
            updateChatControls();
            renderChat();
            try {
                const response = await fetch(server.base + '/api/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        session_id: chatState.sessionId,
                        keep_turns: keepTurns
                    }),
                    signal: chatAbort.signal
                });
                if (!response.ok) {
                    let detail = response.statusText;
                    try { detail = (await response.json()).detail || detail; } catch (e) { }
                    throw new Error(detail);
                }
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let finished = false;
                while (!finished) {
                    const chunk = await reader.read();
                    if (chunk.done) break;
                    buffer += decoder.decode(chunk.value, { stream: true });
                    let nl;
                    while ((nl = buffer.indexOf('\n')) >= 0) {
                        const line = buffer.slice(0, nl).trim();
                        buffer = buffer.slice(nl + 1);
                        if (!line) continue;
                        const event = JSON.parse(line);
                        if (event.type === 'status') {
                            const now = Date.now();
                            const steps = chatProgress.steps;
                            if (steps.length) steps[steps.length - 1].end = now;
                            steps.push({ text: event.message, start: now });
                            updateChatProgress();
                        } else if (event.type === 'answer') {
                            convo.sessionId = event.session_id;
                            convo.messages.push({
                                role: 'assistant',
                                text: event.answer,
                                sources: event.sources,
                                stats: event.stats.footer,
                                turns: event.turns
                            });
                            finished = true;
                        } else if (event.type === 'error') {
                            throw new Error(event.message);
                        }
                    }
                }
                if (!finished) throw new Error('the server closed the connection without an answer');
            } catch (e) {
                if (e.name === 'AbortError') {
                    convo.messages.push({ role: 'notice', text: 'Stopped. Edit or retry the question to ask again.' });
                } else {
                    convo.messages.push({ role: 'error', text: 'Could not answer: ' + e.message });
                }
            } finally {
                clearInterval(chatTimer);
                chatTimer = null;
                chatBusy = false;
                chatAbort = null;
                chatProgress = null;
                updateChatControls();
                chatSaveState();
                renderChat();
                if (!isChatOpen() && chatState === convo) {
                    document.getElementById('chat-trigger').classList.add('unread');
                }
            }
        }

        function setupChat() {
            chatLoadState();
            document.getElementById('chat-trigger').addEventListener('click', openChat);
            document.getElementById('chat-close').addEventListener('click', closeChat);
            document.getElementById('chat-new').addEventListener('click', function() {
                stopChat();
                chatEditing = null;
                chatState = { sessionId: null, messages: [] };
                chatSaveState();
                if (chatServer) renderChat();
            });
            const input = document.getElementById('chat-input');
            document.getElementById('chat-form').addEventListener('submit', function(e) {
                e.preventDefault();
                if (chatBusy) {
                    stopChat();
                    return;
                }
                const q = input.value;
                if (!q.trim()) return;
                input.value = '';
                askChat(q);
            });
            input.addEventListener('keydown', function(e) {
                // Enter never stops a running answer: only the Stop button does.
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (!chatBusy) document.getElementById('chat-form').requestSubmit();
                }
            });
            // Capture phase: Esc minimizes from anywhere in the panel, whatever has focus,
            // unless a diagram or the search box is open on top of it.
            document.addEventListener('keydown', function(e) {
                if (e.key !== 'Escape' || !isChatOpen()) return;
                if (lightboxEl && lightboxEl.classList.contains('open')) return;
                if (document.getElementById('search-modal-backdrop').classList.contains('open')) return;
                e.preventDefault();
                if (chatEditing !== null) cancelChatEdit(); else closeChat();
            }, true);
            // Only same-origin is probed up front (served by `codewiki serve`): a page on
            // GitHub Pages reaches for localhost only once the reader opens the chat.
            findChatServer(true).then(function(server) {
                if (server && currentFile) showStaleBanner(currentFile);
            });
        }

        // ---------- Utilities ----------

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showError(message) {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');

            loading.style.display = 'none';
            content.style.display = 'block';
            content.innerHTML = '<div class="error"><h3>⚠️ Error</h3><p>' +
                escapeHtml(message) + '</p></div>';
            document.getElementById('pager').innerHTML = '';
            document.getElementById('toc-content').innerHTML = '';
            document.querySelector('.content-inner').classList.add('no-toc');
        }
    </script>
</body>
</html>
